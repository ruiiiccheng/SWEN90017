name: Update Wiki on New Issue

on:
  issues:
    types: [closed]

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    steps:
      # The wiki lives at a separate .wiki.git repo, so we clone it manually
      # rather than using actions/checkout.
      - name: Clone wiki repository
        run: |
          git clone https://x-access-token:${{ secrets.WIKI_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki

      - name: Update wiki page
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
          ASSIGNEES_JSON: ${{ toJson(github.event.issue.assignees) }}
        run: |
          cd wiki
          echo "$ASSIGNEES_JSON" | jq -r '.[].login' | while read -r login; do
            file="member-memory-template-${login}.md"
            if [ -f "$file" ]; then
              grep -v "\[#${ISSUE_NUM} -" "$file" > tmp.md || true
              mv tmp.md "$file"
            fi
          done
      - name: Commit and push wiki changes
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add member-memory-template-*.md
          git diff --cached --quiet || git commit -m "Log issue #${{ github.event.issue.number }}"
          git push