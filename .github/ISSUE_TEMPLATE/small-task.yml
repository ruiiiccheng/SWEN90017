name: "Small Task"
description: "Use this for small tasks like updating documentation, minor fixes, or quick chores."
title: "[Task]: "
labels:
  - "small-task"
  - "documentation"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a small task! Please fill out the details below.

  - type: input
    id: summary
    attributes:
      label: Task Summary
      description: A short, clear description of the task
      placeholder: "e.g. Update Definition of Done in team wiki"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What type of task is this?
      options:
        - Documentation
        - Tooling / Setup
        - Technical Documentation
        - Process / Team Agreement
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: estimate
    attributes:
      label: Estimate (hours)
      description: Rough time estimate to complete this task
      placeholder: "e.g. 1"
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Details / Notes
      description: Any additional context, links, or acceptance criteria
      placeholder: "e.g. Update to reflect new sprint cadence, link to wiki page X"
    validations:
      required: false

  - type: input
    id: assignee
    attributes:
      label: Suggested Assignee
      description: Optional — who should pick this up
      placeholder: "@username"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked this task doesn't already exist
          required: true
        - label: This task is small enough to complete in one sitting
          required: false