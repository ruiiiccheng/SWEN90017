name: Bug report
description: Record reproducible incorrect behaviour
title: "[BUG] "
labels: ["type: bug", "status: triage"]
body:
  - type: input
    id: related_story
    attributes:
      label: Related story / PR
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      value: |-
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment, logs and screenshots
